<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book Details | Santiano Books</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =========================
       BOOK DETAILS PAGE
    ========================= */

    .book-page-nav {
      width: min(1100px, 92%);
      margin: 20px auto 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .book-page-nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 42px;

      padding: 0 16px;

      border-radius: 9px;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      transition: 0.2s ease;
    }

    .back-books {
      color: inherit;

      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.04);
    }

    .back-books:hover {
      transform: translateY(-2px);
    }

    .cart-link {
  color: inherit;
  text-decoration: none;
  font-weight: 700;
   }

.cart-link:hover {
  opacity: 0.75;
   }


    /* =========================
       BOOK DETAIL CONTAINER
    ========================= */

    .book-detail {
      width: min(1100px, 92%);
      margin: 35px auto 60px;
    }


    .book-detail-card {
      display: grid;

      grid-template-columns:
        minmax(220px, 280px)
        1fr;

      gap: 45px;

      align-items: start;

      max-width: 950px;

      margin: 0 auto;

      padding: 35px;

      background: rgba(255, 255, 255, 0.04);

      border: 1px solid rgba(255, 255, 255, 0.1);

      border-radius: 20px;
    }


    /* =========================
       BOOK COVER
    ========================= */

    .book-detail-cover {
      width: 280px;
      height: 390px;

      overflow: hidden;

      border-radius: 12px;

      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.25);
    }

    .book-detail-cover img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }


    /* =========================
       BOOK INFORMATION
    ========================= */

    .book-detail-info {
      min-width: 0;
    }

    .book-detail-info h1 {
      margin: 0 0 12px;

      font-size: clamp(28px, 4vw, 46px);

      line-height: 1.1;
    }

    .book-detail-author {
      margin-bottom: 22px;

      opacity: 0.75;

      font-size: 16px;
    }

    .book-detail-description {
      line-height: 1.8;

      font-size: 16px;

      opacity: 0.9;
    }

    .book-detail-price {
      margin: 25px 0;

      font-size: 26px;

      font-weight: 700;
    }


    /* =========================
       BUTTONS
    ========================= */

    .book-detail-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 48px;

      padding: 0 24px;

      border: none;

      border-radius: 10px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 700;

      text-decoration: none;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 800px) {

      .book-detail-card {
        grid-template-columns: 200px 1fr;

        gap: 25px;

        padding: 25px;
      }

      .book-detail-cover {
        width: 200px;
        height: 280px;
      }

      .book-detail-info h1 {
        font-size: 30px;
      }
    }


    /* =========================
       PHONE
    ========================= */

    @media (max-width: 600px) {

      .book-page-nav {
        width: 92%;

        margin-top: 15px;
      }

      .book-page-nav a {
        min-height: 40px;

        padding: 0 13px;

        font-size: 13px;
      }

      .book-detail {
        width: 92%;

        margin-top: 20px;
      }

      .book-detail-card {
        display: flex;

        flex-direction: column;

        align-items: center;

        gap: 25px;

        padding: 20px;

        border-radius: 16px;
      }

      .book-detail-cover {
        width: min(210px, 65vw);
        height: min(295px, 92vw);
      }

      .book-detail-info {
        width: 100%;

        text-align: center;
      }

      .book-detail-info h1 {
        font-size: 28px;
      }

      .book-detail-description {
        text-align: left;

        font-size: 15px;

        line-height: 1.7;
      }

      .book-detail-price {
        font-size: 23px;
      }

      .book-detail-button {
        width: 100%;
      }
    }


    /* =========================
       VERY SMALL PHONES
    ========================= */

    @media (max-width: 380px) {

      .book-page-nav a {
        padding: 0 10px;

        font-size: 12px;
      }

      .book-detail-cover {
        width: 175px;
        height: 245px;
      }

      .book-detail-card {
        padding: 16px;
      }

      .book-detail-info h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       PAGE NAVIGATION
  ========================= -->

  <nav class="book-page-nav">

    <a
      href="books.html"
      class="back-books"
    >
      ← Back to Books
    </a>

    <a
      href="cart.html"
      class="cart-link"
    >
      🛒 Cart
      <span
        data-cart-count
        style="margin-left:6px;"
      >
        0
      </span>
    </a>

  </nav>


  <!-- =========================
       BOOK DETAILS
  ========================= -->

  <main>

    <div
      class="book-detail"
      data-book-detail
    >
      <p>
        Loading book details...
      </p>
    </div>

  </main>


  <script src="js/app.js"></script>

</body>
</html>
