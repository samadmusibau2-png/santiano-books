<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Forgot Password — Santiano Books</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<nav class="navbar">

    <div class="container nav-inner">

        <a
            class="logo"
            href="index.html"
        >

            <span class="logo-mark">
                S
            </span>

            <span class="logo-text">
                <h2>$ΛИŦIΛИØ</h2>
                <small>BOOKS</small>
            </span>

        </a>
    
        <a
            class="outline-btn"
            style="color:#d0a45c"
            href="login.html"
        >
            Back to Login
        </a>

    </div>

</nav>


<main class="page">

    <div class="form-wrap">

        <div
            class="eyebrow"
            style="text-align:center"
        >
            SANTIANO BOOKS
        </div>

        <h1>
            Forgot Password?
        </h1>

        <p
            class="muted"
            style="text-align:center"
        >
            Enter your email address and we will send you a
            password-reset link.
        </p>


        <form id="forgotPasswordForm">

            <div class="field">

                <label for="forgotEmail">
                    EMAIL ADDRESS
                </label>

                <input
                    id="forgotEmail"
                    name="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="gold-btn full"
                id="forgotPasswordButton"
            >
                SEND RESET LINK
            </button>

        </form>


        <p
            id="forgotPasswordMessage"
            class="muted"
            style="
                text-align:center;
                margin-top:15px;
                min-height:40px;
            "
        ></p>


        <div class="form-foot">
        
            Remember your password?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</main>


<script src="js/auth.js"></script>

</body>

</html>
