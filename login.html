<!doctype html>

<html lang="en">

<head>

```
<meta charset="utf-8">

<meta

>

<title>Login — Santiano Books</title>

<link
    rel="stylesheet"
    href="css/style.css"
>
```

</head>

<body>

<nav class="navbar">

```
<div class="container nav-inner">

    <a
        class="logo"
        href="index.html"
    >

        <span class="logo-mark">
            S
        </span>

        <span class="logo-text">
            <h2>$ΛИŦIΛИØ</h2>
            <small>BOOKS</small>
        </span>

    </a>

    <a
        class="outline-btn"
        style="color:#d0a45c"
        href="index.html"
    >
        Back Home
    </a>

</div>
```

</nav>

<main class="page">

```
<div class="form-wrap">

    <div
        class="eyebrow"
        style="text-align:center"
    >
        SANTIANO BOOKS
    </div>

    <h1>
        Welcome Back
    </h1>

    <p
        class="muted"
        style="text-align:center"
    >
        Login to continue your digital reading journey.
    </p>


    <form id="loginForm">

        <div class="field">

            <label for="loginEmail">
                EMAIL ADDRESS
            </label>

            <input
                id="loginEmail"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

        </div>


        <div class="field">

            <label for="loginPassword">
                PASSWORD
            </label>

            <input
                id="loginPassword"
                name="password"
                type="password"
                placeholder="Your password"
                autocomplete="current-password"
                required
            >

            <div style="text-align:right; margin-top:8px;">

                

            </div>

        </div>


        <button
            type="submit"
            class="gold-btn full"
            id="loginButton"
        >
            LOGIN
        </button>

    </form>


    <p
        id="loginMessage"
        class="muted"
        style="
            text-align:center;
            margin-top:15px;
            min-height:20px;
        "
    ></p>


    <div class="form-foot">

        Don't have an account?

        <a href="register.html">
            Create one
        </a>

    </div>

</div>
```

</main>

<script src="js/auth.js"></script>

</body>

</html>
